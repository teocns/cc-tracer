# Live only where this folder is the repo root (cc-tracer); inside the kit, GitHub never reads it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tests
        run: uv run --frozen pytest -q
      - name: runs with no other plugin
        run: |
          uv run --frozen python -c "import sys, tracer.cli, tracer.calls; bad = [m for m in sys.modules if m.split('.')[0] in ('ak', 'vault', 'memory', 'observer')]; sys.exit(f'imports {bad}' if bad else 0)"
          bin/tracer sessions -h | grep -q "Usage: tracer sessions"
